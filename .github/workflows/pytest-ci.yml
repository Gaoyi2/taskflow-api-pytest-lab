name: TaskFlow Pytest CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: Unit + Real HTTP Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Create output folders
        run: mkdir -p reports logs

      - name: Run ALL tests and generate HTML + JUnit XML
        run: |
          python -m pytest -v \
            --html=reports/report.html \
            --self-contained-html \
            --junitxml=reports/results.xml

      - name: Upload test reports and logs (even on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-test-reports
          path: |
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 14
