[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-api-pytest-lab"
version = "1.0.0"
description = "A self-contained REST API + Pytest automation + GitHub Actions learning project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-html>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: isolated local unit tests",
    "integration: actual HTTP requests to local test server",
    "smoke: core readiness and CRUD tests",
    "negative: invalid data and not-found tests",
]
log_cli = true
log_cli_level = "WARNING"
log_file = "logs/pytest.log"
log_file_level = "INFO"
log_format = "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
